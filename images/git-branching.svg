<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Gitで変更を記録し、ブランチで作業する</title>
  <desc id="description">mainブランチからfeatureブランチを作り、変更を記録してmainへ統合する図。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/>
      <stop offset="1" stop-color="#ece5d8"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243b53"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#102a43" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#paper)"/>
  <path d="M56 0h8v480h-8z" fill="#d7a65b" opacity=".8"/>
  <g filter="url(#shadow)">
    <rect x="94" y="58" width="1012" height="364" rx="20" fill="url(#cover)"/>
  </g>
  <text x="146" y="124" fill="#e2bb72" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="4">THE PRACTICAL GUIDE</text>
  <text x="146" y="187" fill="#fffaf0" font-family="sans-serif" font-size="47" font-weight="700">変更を記録し、ブランチで進める</text>
  <text x="148" y="226" fill="#cbd5df" font-family="sans-serif" font-size="20">小さく記録して、確かめながら共有する。</text>
  <path d="M210 318h820" fill="none" stroke="#78c6a3" stroke-width="8" stroke-linecap="round"/>
  <path d="M462 318c55 0 79-56 136-56h270c57 0 81 56 136 56" fill="none" stroke="#efb15b" stroke-width="8" stroke-linecap="round"/>
  <g fill="#102a43" stroke="#fffaf0" stroke-width="5">
    <circle cx="210" cy="318" r="13"/>
    <circle cx="462" cy="318" r="13"/>
    <circle cx="598" cy="262" r="13"/>
    <circle cx="868" cy="262" r="13"/>
    <circle cx="1030" cy="318" r="13"/>
  </g>
  <text x="148" y="354" fill="#cbd5df" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="1">MAIN</text>
  <text x="665" y="246" fill="#cbd5df" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="1">FEATURE</text>
  <text x="980" y="354" fill="#cbd5df" font-family="sans-serif" font-size="14">MERGE</text>
</svg>
